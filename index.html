<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Landing Page</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="css/main.css" />
		<link rel="stylesheet" href="css/media.css" />
	</head>
	<body>
        <!-- Header -->
        <header class="header">
            <div class="container">
                <div class="header__flex">
                    <!-- Logo -->
                    <div class="header-logo">
                        <img src="img/Logo.svg" alt="Site logo" class="header-logo__img">
                    </div>
                    <!-- Navbar -->
                    <nav class="navbar">
                        <ul class="navbar__menu">
                            <li class="navbar__item"><a class="navbar__link" href="#">Why Alivio</a></li>
                            <li class="navbar__item"><a class="navbar__link" href="#">Solutions</a></li>
                            <li class="navbar__item"><a class="navbar__link" href="#">Community</a></li>
                            <li class="navbar__item"><a class="navbar__link" href="#">Pricing</a></li>
                        </ul>
                    </nav>
                    <!-- Auth -->
                    <div class="auth">
                        <a class="auth__link" href="#">Sign in</a>
                    </div>
                    <!-- Button -->
                    <button class="btn btn--size-small">Start Trial</button>
                </div>
            </div>
            <!-- Headline -->
            <div class="headline">
                <div class="container">
                    <div class="headline-inner">
                        <h1 class="headline__title">
                            Be aware, Manage well.
                        </h1>
                        <p class="headline__paragrah">
                            Everyone experiences stress in different ways. Let Alivio guide you, in a personalized journal experience, to overcome your stress.
                        </p>
                        <button class="btn btn--size-large">Find Your Way</button>
                    </div>
                </div>
            </div>
        </header>
    </body>
</html>
